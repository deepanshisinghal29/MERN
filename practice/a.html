<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css</title>
</head>
<style>
    *{
        box-sizing:border-box;
    }
    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;

    }
    .box{
        border:4px solid black;
        height:80vh;
        width: 40vw;
        background-color:aquamarine;
    }
    .small{
        border:3px solid black;
        height:25%;
        padding:10px;
        margin:3px;
    }
</style>
<body>
    <div class="box">
        <div class="small"></div>
        <div class="small"></div>
        <div class="small"></div>
        <div class="small"></div>
    </div>
</body>
</html>
