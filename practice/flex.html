<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEX</title>
</head>
<style>
    *{
        margin:0;
    }
    .main{
        border: 2px solid red ;
        height: 100vh;
        background-color :aqua;
        display:flex;
        
        align-items: center;
        flex-wrap:wrap;
    }
    .box{
        border:6px solid black;
        height:50px;
        width:40px;
        background-color:rgb(195, 165, 222);
        margin:20px;
        border-radius: 20%;
        flex-shrink:0;
        display:flex;
        justify-content:center;
        align-items:center;
        color:blueviolet;
    }
    .b1{
        border:6px solid black;
        height:500px;
        width:500px;
        background-color:rgb(173, 135, 209);
        margin:20px;
        border-radius: 20%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    #new{
       border:6px solid black;
       background-color: yellow;
       height:50px;
       width:100px;
       margin:20px;
    }
    body{
        font-size: 12px ;
    }
    #1{
        font-size:2em;
    }
    #2{
        font-size:10px;
    }
    #3{
        font-size:3rem;
    }
    #4{
        font-size:50%;
    }
</style>
<body>
    <div class="main">
        <p id="1">hii--</p>
        <p id="2">hii--</p>
        <p id="3">hii--</p>
        <p id="4">hii--</p> 
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
        <div class="box">Box</div>
    </div>
    <div class="b1">
        <div  id="new"></div>
    </div>
</body>
</html>
